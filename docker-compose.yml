# Djassa Online — orchestration locale de la cible microservices.
# Stack microservices — gateway :8080, PostgreSQL :5433, Redis :6380.
# Cette stack cible utilise des ports distincts (5433, 6380, 8080) : aucun conflit.
#   docker compose up -d        # tous les services (infra + gateway + 5 microservices)

name: djassa

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-djassa_dev}
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"          # 5432 déjà occupé sur l'hôte
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init/01-create-databases.sql:/docker-entrypoint-initdb.d/01-create-databases.sql:ro
      - ./database/schemas:/docker-entrypoint-initdb.d/schemas:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"          # 6379 déjà occupé sur l'hôte
    volumes:
      - redisdata:/data

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-djassa_dev}
      DB_HOST: postgres
      DB_PORT: 5432
      LISTEN_PORT: 6432
      AUTH_TYPE: scram-sha-256
      # Pool toutes les bases du cluster postgres (auth, catalog, troc, escrow, chat)
      PGBOUNCER_DATABASE: "*"
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 200
      PGBOUNCER_DEFAULT_POOL_SIZE: 20
    ports:
      - "6432:6432"
    depends_on: { postgres: { condition: service_healthy } }
    restart: unless-stopped

  api-gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    expose:
      - "8081"
    volumes:
      - ./backend/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [auth-subscription-service, catalog-boutique-service, troc-engine-service, escrow-payment-service, notification-chat-service]


  auth-subscription-service:
    image: djassa-php:8.4
    working_dir: /repo/services/auth-subscription-service
    volumes:
      - .:/repo
      - ./services/auth-subscription-service/.env.docker:/repo/services/auth-subscription-service/.env:ro
    command: php artisan serve --host=0.0.0.0 --port=8080
    environment:
      APP_ENV: local
      DB_HOST: pgbouncer
      DB_PORT: 6432
      DB_DATABASE: djassa_auth_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-djassa_dev}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DJASSA_INTERNAL_API_URL: http://api-gateway:8081/internal
      DJASSA_INTERNAL_SIGNING_KEY: ${DJASSA_INTERNAL_SIGNING_KEY:-dev-signing-key}
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }

  catalog-boutique-service:
    image: djassa-php:8.4
    working_dir: /repo/services/catalog-boutique-service
    volumes:
      - .:/repo
      - ./services/catalog-boutique-service/.env.docker:/repo/services/catalog-boutique-service/.env:ro
    command: php artisan serve --host=0.0.0.0 --port=8080
    environment:
      APP_ENV: local
      DB_HOST: pgbouncer
      DB_PORT: 6432
      DB_DATABASE: djassa_catalog_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-djassa_dev}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CACHE_PREFIX: "djassa:catalog:"
      REDIS_CACHE_TTL: 300
      DJASSA_INTERNAL_API_URL: http://api-gateway:8081/internal
      DJASSA_INTERNAL_SIGNING_KEY: ${DJASSA_INTERNAL_SIGNING_KEY:-dev-signing-key}
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }

  troc-engine-service:
    image: djassa-php:8.4
    working_dir: /repo/services/troc-engine-service
    volumes:
      - .:/repo
      - ./services/troc-engine-service/.env.docker:/repo/services/troc-engine-service/.env:ro
    command: php artisan serve --host=0.0.0.0 --port=8080
    environment:
      APP_ENV: local
      DB_HOST: pgbouncer
      DB_PORT: 6432
      DB_DATABASE: djassa_troc_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-djassa_dev}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CATALOG_INTERNAL_URL: http://catalog-boutique-service:8080
      ESCROW_INTERNAL_URL: http://escrow-payment-service:8080
      DJASSA_INTERNAL_API_URL: http://api-gateway:8081/internal
      DJASSA_INTERNAL_SIGNING_KEY: ${DJASSA_INTERNAL_SIGNING_KEY:-dev-signing-key}
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }

  escrow-payment-service:
    image: djassa-php:8.4
    working_dir: /repo/services/escrow-payment-service
    volumes:
      - .:/repo
      - ./services/escrow-payment-service/.env.docker:/repo/services/escrow-payment-service/.env:ro
    command: php artisan serve --host=0.0.0.0 --port=8080
    environment:
      APP_ENV: local
      DB_HOST: pgbouncer
      DB_PORT: 6432
      DB_DATABASE: djassa_escrow_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-djassa_dev}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GENIUSPAY_API_KEY: ${GENIUSPAY_API_KEY:-}
      GENIUSPAY_API_SECRET: ${GENIUSPAY_API_SECRET:-}
      GENIUSPAY_WEBHOOK_SECRET: ${GENIUSPAY_WEBHOOK_SECRET:-}
      DJASSA_INTERNAL_API_URL: http://api-gateway:8081/internal
      DJASSA_INTERNAL_SIGNING_KEY: ${DJASSA_INTERNAL_SIGNING_KEY:-dev-signing-key}
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }

  notification-chat-service:
    image: djassa-php:8.4
    working_dir: /repo/services/notification-chat-service
    volumes:
      - .:/repo
      - ./services/notification-chat-service/.env.docker:/repo/services/notification-chat-service/.env:ro
    command: php artisan serve --host=0.0.0.0 --port=8080
    environment:
      APP_ENV: local
      DB_HOST: pgbouncer
      DB_PORT: 6432
      DB_DATABASE: djassa_chat_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-djassa_dev}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_EVENTS_STREAM: djassa.events
      REDIS_NOTIFICATION_QUEUE: djassa:notifications:jobs
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_CONNECT_TIMEOUT: 3
      BREVO_TIMEOUT: 8
      DJASSA_INTERNAL_SIGNING_KEY: ${DJASSA_INTERNAL_SIGNING_KEY:-dev-signing-key}
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }

volumes:
  pgdata:
  redisdata:

networks:
  default:
    name: djassa-net
