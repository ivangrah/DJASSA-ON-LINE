# Djassa Online — API Gateway (scaffold)
# Routage unique /api/v1/*, rate limiting et propagation identité/rôle.
# Le module auth_request valide le JWT auprès de auth-subscription-service avant tout proxying.

limit_req_zone $binary_remote_addr zone=djassa_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=djassa_api:10m  rate=60r/m;
# Zone dédiée au Super Dashboard : many endpoints en parallèle (KPI + graphs + tables).
limit_req_zone $binary_remote_addr zone=djassa_admin:10m rate=120r/m;

map $request_method $catalog_auth { default 1; GET 0; HEAD 0; OPTIONS 0; }

upstream auth_service       { server auth-subscription-service:8080; }
upstream catalog_service    { server catalog-boutique-service:8080; }
upstream troc_service       { server troc-engine-service:8080; }
upstream escrow_service     { server escrow-payment-service:8080; }
upstream chat_service       { server notification-chat-service:8080; }


# Serveur INTERNE — écoute sur 8081, NON publié sur l'hôte (docker-compose).
# Seuls les conteneurs du réseau djassa-net peuvent appeler /internal/*.
server {
    listen 8081;
    server_name _;

    location /internal/escrow/ {
        proxy_pass http://escrow_service;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /internal/catalog/ {
        proxy_pass http://catalog_service;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /internal/troc/ {
        proxy_pass http://troc_service;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /internal/chat/ {
        proxy_pass http://chat_service;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /internal/auth/ {
        proxy_pass http://auth_service;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 8080;
    server_name _;

    # Anti-clickjacking (frame-ancestors ne fonctionne qu'en header HTTP, pas en meta).
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none';" always;

    # Règle 24 — compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Règle 25 — cache navigateur long sur les assets buildés
    location ~* \.(js|css|png|jpg|jpeg|webp|avif|gif|svg|woff2|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Validation JWT centrale. auth-subscription-service renvoie X-User-Id et X-User-Role.
    location = /_validate {
        internal;
        proxy_pass http://auth_service/internal/jwt/validate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Gateway-Internal 1;
        proxy_set_header Cookie $http_cookie;
    }

    # Routes auth publiques : pas de auth_request, chemin complet préservé.
    location = /api/v1/maintenance {
        proxy_pass http://auth_service;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/api/v1/auth/(register|login|google)$ {
        limit_req zone=djassa_api burst=30 nodelay;
        proxy_pass http://auth_service;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Alias E2E / compat: finances admin -> catalogue finances.
    location = /api/v1/admin/finances {
        limit_req zone=djassa_admin burst=40 nodelay;
        auth_request /_validate;
        auth_request_set $user_id   $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;
        proxy_pass http://catalog_service/api/v1/admin/catalog/boutiques/finances;
        proxy_set_header X-User-Id   $user_id;
        proxy_set_header X-User-Role $user_role;
        proxy_set_header X-Real-IP   $remote_addr;
    }
    # Alias E2E / compat: boutiques admin CRUD.
    location = /api/v1/admin/boutiques {
        limit_req zone=djassa_admin burst=40 nodelay;
        auth_request /_validate;
        auth_request_set $user_id   $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;
        proxy_pass http://catalog_service/api/v1/admin/catalog/boutiques;
        proxy_set_header X-User-Id   $user_id;
        proxy_set_header X-User-Role $user_role;
        proxy_set_header X-Real-IP   $remote_addr;
    }
    location ~ ^/api/v1/admin/boutiques/(.+)$ {
        limit_req zone=djassa_admin burst=40 nodelay;
        auth_request /_validate;
        auth_request_set $user_id   $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;
        proxy_pass http://catalog_service/api/v1/admin/catalog/boutiques/$1;
        proxy_set_header X-User-Id   $user_id;
        proxy_set_header X-User-Role $user_role;
        proxy_set_header X-Real-IP   $remote_addr;
    }
    # Super Dashboard Admin — volet catalogue/boutiques.
    location ~ ^/api/v1/admin/catalog(/|$) {
        limit_req zone=djassa_admin burst=40 nodelay;
        auth_request /_validate;
        auth_request_set $user_id   $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;
        proxy_pass http://catalog_service;
        proxy_set_header X-User-Id   $user_id;
        proxy_set_header X-User-Role $user_role;
        proxy_set_header X-Real-IP   $remote_addr;
    }

    # Super Dashboard Admin — centre de notifications/campagnes.
    location = /api/v1/admin/campaigns {
        limit_req zone=djassa_admin burst=40 nodelay;
        auth_request /_validate;
        auth_request_set $user_id   $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;
        proxy_pass http://chat_service/api/v1/admin/notifications/broadcast;
        proxy_set_header X-User-Id   $user_id;
        proxy_set_header X-User-Role $user_role;
        proxy_set_header X-Real-IP   $remote_addr;
    }
    location ~ ^/api/v1/admin/notifications(/|$) {
        limit_req zone=djassa_admin burst=40 nodelay;
        auth_request /_validate;
        auth_request_set $user_id   $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;
        proxy_pass http://chat_service;
        proxy_set_header X-User-Id   $user_id;
        proxy_set_header X-User-Role $user_role;
        proxy_set_header X-Real-IP   $remote_addr;
    }

    # Super Dashboard Admin : JWT validé + role admin vérifié côté service (middleware admin).
    location ~ ^/api/v1/admin(/|$) {
        limit_req zone=djassa_admin burst=40 nodelay;
        auth_request /_validate;
        auth_request_set $user_id   $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;
        proxy_pass http://auth_service;
        proxy_set_header X-User-Id   $user_id;
        proxy_set_header X-User-Role $user_role;
        proxy_set_header X-Real-IP   $remote_addr;
    }

    # Routes auth protégées + abonnements : JWT validé par auth-subscription-service.
    location ~ ^/api/v1/(auth|abonnements)/ {
        limit_req zone=djassa_api burst=30 nodelay;
        auth_request /_validate;
        auth_request_set $user_id   $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;
        proxy_pass http://auth_service;
        proxy_set_header X-User-Id   $user_id;
        proxy_set_header X-User-Role $user_role;
        proxy_set_header X-Real-IP   $remote_addr;
    }

    # Catalogue : GET public (cache Redis), écritures protégées par auth_request.
    location ~ ^/api/v1/(products|boutiques|souhaits)(/.*)?$ {
        limit_req zone=djassa_api burst=30 nodelay;
        error_page 418 = @catalog_protected;
        if ($catalog_auth) { return 418; }
        proxy_pass http://catalog_service;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location @catalog_protected {
        auth_request /_validate;
        auth_request_set $user_id   $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;
        proxy_pass http://catalog_service;
        proxy_set_header X-User-Id   $user_id;
        proxy_set_header X-User-Role $user_role;
        proxy_set_header X-Real-IP   $remote_addr;
    }

    location /api/v1/catalog/ {
        limit_req zone=djassa_api burst=30 nodelay;
        auth_request /_validate;
        auth_request_set $user_id   $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;
        proxy_pass http://catalog_service/;
        proxy_set_header X-User-Id   $user_id;
        proxy_set_header X-User-Role $user_role;
    }

    location ~ ^/api/v1/(trocs|barter-offers)(/.*)?$ {
        limit_req zone=djassa_api burst=20 nodelay;
        auth_request /_validate;
        auth_request_set $user_id   $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;
        proxy_pass http://troc_service;
        proxy_set_header X-User-Id   $user_id;
        proxy_set_header X-User-Role $user_role;
    }

    # Séquestre : rate limiting plus strict + corps brut transmis pour HMAC.
    location /api/v1/escrow/ {
        limit_req zone=djassa_auth burst=5 nodelay;
        auth_request /_validate;
        auth_request_set $user_id $upstream_http_x_user_id;
        proxy_pass http://escrow_service;
        proxy_set_header X-User-Id $user_id;
        proxy_set_header X-Original-Body $request_body;
    }

    location ~ ^/api/v1/(messages|conversations|notifications)(/.*)?$ {
        limit_req zone=djassa_api burst=30 nodelay;
        auth_request /_validate;
        auth_request_set $user_id $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;
        proxy_pass http://chat_service;
        proxy_set_header X-User-Id   $user_id;
        proxy_set_header X-User-Role $user_role;
    }


    # Webhook GeniusPay public (HMAC vérifié côté service, pas de JWT).
    location = /api/v1/webhooks/geniuspay {
        proxy_pass http://escrow_service/internal/webhooks/geniuspay;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Alias de transition : anciens chemins du monolithe -> service escrow.
    location ~ ^/api/v1/(payments/geniuspay/init|transactions(?:/.*)?)$ {
        limit_req zone=djassa_api burst=30 nodelay;
        auth_request /_validate;
        auth_request_set $user_id $upstream_http_x_user_id;
        proxy_pass http://escrow_service;
        proxy_set_header X-User-Id $user_id;
    }

    # /internal/* : strictement interdit depuis l'extérieur (port 8081 réservé au réseau Docker).
    location ~ ^/internal(/|$) { return 403; }

    location = /healthz { access_log off; return 200 "ok\n"; }
}
