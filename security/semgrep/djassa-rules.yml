rules:
  - id: djassa-geniuspay-secret-hardcoded
    languages: [php, javascript, typescript, python]
    severity: ERROR
    message: >-
      Clé GeniusPay / Wave / MTN codée en dur. Utiliser une variable d'environnement
      et un secret injecté. Voir AUDIT_APPLICATION.md finding B5.
    patterns:
      - pattern-regex: '(?i)(geniuspay|wave|orange|mtn|moov)[_A-Z]*(api[_]?key|secret|token)\s*[=:]\s*["''][A-Za-z0-9]{12,}["'']'
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 Identification and Authentication Failures"

  - id: djassa-pin-jamais-logger
    languages: [php, javascript, typescript]
    severity: ERROR
    message: >-
      Un code PIN à 4 chiffres semble journalisé. Le PIN doit rester haché (bcrypt)
      dans djassa_escrow_db et ne jamais apparaître dans un log ou une réponse.
    patterns:
      - pattern-regex: '(?i)(Log::|logger->|console\.)\w+\([^)]*\bpin\b[^)]*\)'
    metadata:
      category: security
      cwe: "CWE-532: Insertion of Sensitive Information into Log File"
      owasp: "A09:2021 Security Logging and Monitoring Failures"

  - id: djassa-raw-sql-avec-entree-utilisateur
    languages: [php]
    severity: WARNING
    message: >-
      Requête SQL brute construite avec une entrée requête. Préférer les requêtes
      paramétrées / Eloquent / Query Builder.
    patterns:
      - pattern-either:
          - pattern: DB::raw($INPUT)
          - pattern: DB::select($INPUT)
          - pattern: DB::statement($INPUT)
      - metavariable-regex:
          metavariable: $INPUT
          regex: '(?i).*(request|input|query|post|get).*'
    metadata:
      category: security
      cwe: "CWE-89: SQL Injection"
      owasp: "A03:2021 Injection"

# La vérification HMAC des webhooks est couverte par GeniusPayWebhookTest (signature invalide -> 401,
# webhook rejoué -> idempotent) et par le boot guard GeniusPay en production.
